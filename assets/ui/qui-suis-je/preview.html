<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACKLE — carte Qui suis-je ?</title><link rel="stylesheet" href="qui-suis-je.css"><style>body{margin:0;padding:18px;background:#071510;color:#e9eee8;font-family:Arial,sans-serif}main{max-width:430px;margin:auto}h1{font:900 23px Impact,Arial,sans-serif;text-align:center}.stages{display:flex;gap:5px;margin:12px 0}.stages button{flex:1;min-height:38px;background:#17281f;color:#e3e9de;border:1px solid #a78b52;border-radius:7px}.stages button[aria-pressed="true"]{background:#e7bf65;color:#101912;font-weight:900}.note{font-size:13px;line-height:1.45;color:#bbd1c4}</style></head>
<body><main><h1>QUI SUIS-JE ? · CARTE CENTRALE</h1><div class="stages" aria-label="Prévisualiser l'indice"><button type="button" data-stage="1">1</button><button type="button" data-stage="2">2</button><button type="button" data-stage="3" aria-pressed="true">3</button><button type="button" data-stage="4">4</button><button type="button" data-stage="5">5</button></div>
<section class="qsj-board" aria-label="Exemple de carte Qui suis-je"><h2 class="qsj-title">QUI SUIS-JE ?</h2><div class="qsj-mystery" aria-hidden="true"><span class="qsj-mystery-mark">?</span></div><ol class="qsj-list" id="clues"></ol><div class="qsj-actions"><button class="qsj-answer" type="button">RÉPONDRE</button><button class="qsj-pass" type="button">PASSER</button></div></section>
<p class="note">Aperçu graphique. Les cinq libellés sont des exemples. Dans le jeu, l'application fournit la vraie fiche, le chrono, les scores, le Tackle, la saisie et le verdict commun.</p></main>
<script>
const demo=['River Plate','Ligue Europa','Attaquant','James Rodríguez','Colombien'];
function render(stage){document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.stage)===stage)));document.getElementById('clues').innerHTML=demo.map((label,i)=>{const n=i+1,kind=n<stage?'past':n===stage?'current':'locked';return `<li class="qsj-clue qsj-clue--${kind}"><span class="qsj-clue-copy">${n} · ${n<=stage?label:'INDICE À VENIR'}</span>${n===stage?`<span class="qsj-points">${6-n} PTS</span>`:''}</li>`}).join('')}
document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.stage))));render(3);
</script></body></html>
